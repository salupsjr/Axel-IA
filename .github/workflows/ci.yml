name: AXEL CI - AppSec & Core Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai python-dotenv rich

      - name: Rodar suíte de testes (AppSec, AST, Squad e SQLite)
        run: pytest -v